# Production inherits the audited file boundary from alpha, then turns on
# integrity properties that must never be silently weakened for a release.
extends: ./electron-builder.alpha.yml

directories:
  output: release

asar: true

win:
  signAndEditExecutable: true
  forceCodeSigning: true
  certificateFile: "${env.WIN_CSC_LINK}"
  certificatePassword: "${env.WIN_CSC_KEY_PASSWORD}"
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 鱼饼大王

portable:
  artifactName: "${productName}-${version}-portable.${ext}"
