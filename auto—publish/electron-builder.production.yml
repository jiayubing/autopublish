# Production inherits the audited file boundary from alpha, then turns on
# integrity properties that must never be silently weakened for a release.
extends: ./electron-builder.alpha.yml

directories:
  output: release

asar: true
forceCodeSigning: true

# The manifest and one-shot migration tool are operator resources, not app
# modules. Keeping them outside app.asar makes their paths explicit and lets
# the offline verifier hash the exact files shipped in a release.
extraResources:
  - from: build/production-artifact-manifest.json
    to: production-artifact-manifest.json
  - from: scripts/migrate-content-library-v2.js
    to: migration/migrate-content-library-v2.js

win:
  signAndEditExecutable: true
  signtoolOptions:
    certificateFile: "${env.WIN_CSC_LINK}"
    certificatePassword: "${env.WIN_CSC_KEY_PASSWORD}"
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ETO—001

portable:
  artifactName: "${productName}-${version}-portable.${ext}"
