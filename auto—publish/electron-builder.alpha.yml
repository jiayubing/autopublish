appId: com.autopublish.desktop-alpha
productName: AutoPublish
copyright: "Copyright © 2026"

directories:
  app: .
  output: release-alpha
  buildResources: build

files:
  # Electron main process
  - desktop/**/*
  - "!desktop/renderer/**"
  # Business logic (adapters, core, platforms)
  - src/**/*
  # Config defaults (platforms.json)
  - config/**/*
  # Runtime scripts required by adapters (config.js, etc.)
  - scripts/**/*
  # React production build (generated by build:renderer)
  - media-workbench/dist/**/*
  # Adapter runtime helpers (Python scripts, etc.)
  - src/platforms/hepan/hepan_publish.py
  # Do not list node_modules here. electron-builder derives the complete
  # production dependency closure from package.json/package-lock, including
  # transitive dependencies required by mammoth and form-data.
  # Exclude dev/cache noise
  - "!node_modules/.cache/**"
  - "!**/*.map"
  - "!**/*.tsbuildinfo"

  # ---- NEVER BUNDLE PRIVATE RUNTIME DATA ----
  - "!**/.env"
  - "!input/**"
  - "!data/**"
  - "!logs/**"
  - "!published/**"
  - "!failed/**"
  - "!tmp/**"
  - "!work/**"
  - "!.playwright-cli/**"
  # Keep test articles out of the package
  - "!input/media/**"
  - "!input/lieju/**"
  - "!input/toutiao/**"
  - "!input/hepan/**"
  # Repo metadata
  - "!docs/**"
  - "!tests/**"
  - "!.git/**"
  - "!release-alpha/**"

# Keep files unpacked: adapters execute Python helpers and resolve workspace
# runtime scripts by filesystem path; packing them into asar would break that.
asar: false

win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Alpha-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AutoPublish Alpha

portable:
  artifactName: "${productName}-Alpha-${version}-portable.${ext}"
