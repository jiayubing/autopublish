appId: com.autopublish.desktop
productName: AutoPublish
copyright: "Copyright © 2026"

directories:
  app: .
  output: release-alpha
  buildResources: build

files:
  # Electron main process
  - desktop/**/*
  # Business logic (adapters, core, platforms)
  - src/**/*
  # Config defaults (platforms.json)
  - config/**/*
  # Runtime scripts required by adapters (config.js, etc.)
  - scripts/**/*
  # Standard Node used to execute the packaged Playwright CLI.
  - from: build/runtime-tools/node
    to: tools/node
    filter:
      - "**/*"
  # One-shot data migration is an operator tool, never an installed app asset.
  - "!scripts/migrate-content-library-v2.js"
  # React production build (generated by build:renderer)
  - media-workbench/dist/**/*
  # Adapter runtime helpers (Python scripts, etc.)
  - src/platforms/hepan/hepan_publish.py
  # Read-only builtin content templates
  - resources/content-templates/**/*
  # Do not list node_modules here. electron-builder derives the complete
  # production dependency closure from package.json/package-lock, including
  # transitive dependencies required by mammoth and form-data.
  # Exclude dev/cache noise
  - "!node_modules/.cache/**"
  - "!**/*.map"
  - "!**/*.tsbuildinfo"

  # ---- NEVER BUNDLE PRIVATE RUNTIME DATA ----
  - "!**/.env"
  - "!**/ai-provider.json"
  - "!**/workspace-location.json"
  - "!input/**"
  - "!data/**"
  - "!**/content-generation-batches/**"
  - "!logs/**"
  - "!**/doubao-diagnostics/**"
  - "!published/**"
  - "!failed/**"
  - "!tmp/**"
  - "!work/**"
  - "!**/client-material-cache/**"
  - "!.playwright-cli/**"
  - "!browser/**"
  - "!**/browser/**"
  - "!research/**"
  - "!**/research/**"
  - "!clients/**"
  - "!generated/**"
  - "!**/generated/**"
  - "!tests/fixtures/**"
  - "!**/tests/fixtures/**"
  # Repo metadata
  - "!docs/**"
  - "!.git/**"
  - "!release-alpha/**"

# Keep files unpacked: adapters execute Python helpers and resolve workspace
# runtime scripts by filesystem path; packing them into asar would break that.
asar: false

win:
  # Alpha artifacts are intentionally unsigned; production signing is a release-pipeline concern.
  signExecutable: false
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Alpha-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AutoPublish Alpha

portable:
  artifactName: "${productName}-Alpha-${version}-portable.${ext}"
