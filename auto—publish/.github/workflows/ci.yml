name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix media-workbench
      - run: npm ci --prefix auth-server
      - run: npm run test
      - run: npm run test:auth
      - run: npm run lint
      - run: npm run typecheck:renderer
      - run: npm run typecheck:bridge
      - run: npm run build:renderer
      - run: npm audit --audit-level=high
      - run: node --test tests/production-packaging.test.js

  link-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:links
