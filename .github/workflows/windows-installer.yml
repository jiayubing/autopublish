name: Windows Installer
# Temporary PR trigger for PR #7 installer smoke build.

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - .github/workflows/windows-installer.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: false
        default: ""

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      CI_SYNTHETIC_ONLY: "1"
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auto—publish/package-lock.json

      - run: npm ci
        working-directory: auto—publish

      - run: npm ci
        working-directory: auto—publish/media-workbench

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: auto—publish

      - name: Run desktop core tests
        run: npm run test:desktop-core
        working-directory: auto—publish

      - name: Build unsigned Windows installer
        run: npm run dist:alpha:dirty
        working-directory: auto—publish

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ETO-001-windows-installer
          path: |
            auto—publish/release-alpha/*.exe
          if-no-files-found: error
          retention-days: 14
