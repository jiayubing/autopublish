name: Windows Installer
# Temporary package trigger for PR #37 install testing.

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed
  pull_request:
    paths:
      - .github/workflows/windows-installer.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: false
        default: ""

permissions:
  contents: read

jobs:
  installer:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    env:
      CI_SYNTHETIC_ONLY: "1"
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          # Package the PR branch itself, not the synthetic merge with master.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auto—publish/package-lock.json

      - run: npm ci
        working-directory: auto—publish

      - run: npm ci
        working-directory: auto—publish/media-workbench

      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install chromium
        working-directory: auto—publish

      - name: Run desktop core tests
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:desktop-core
        working-directory: auto—publish

      - name: Build unsigned Windows installer
        run: npm run dist:alpha:dirty
        working-directory: auto—publish

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ETO-001-windows-installer
          path: |
            auto—publish/release-alpha/*.exe
          if-no-files-found: error
          retention-days: 14
