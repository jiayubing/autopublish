name: Normalize xmldom lock diff

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/normalize-xmldom-lock.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore original lock formatting and patch xmldom only
        shell: bash
        run: |
          git show 0daf2fdd0245f77138540f98d4dbf06bf21954d6:auto—publish/package-lock.json > auto—publish/package-lock.json
          python - <<'PY'
          from pathlib import Path
          p = Path('auto—publish/package-lock.json')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '"version": "0.8.13"': '"version": "0.8.15"',
              'https://registry.npmjs.org/@xmldom/xmldom/-/xmldom-0.8.13.tgz': 'https://registry.npmjs.org/@xmldom/xmldom/-/xmldom-0.8.15.tgz',
              'sha512-KRYzxepc14G/CEpEGc3Yn+JKaAeT63smlDr+vjB8jRfgTBBI9wRj/nkQEO+ucV8p8I9bfKLWp37uHgFrbntPvw==': 'sha512-/5NV/vDALVFDXgLmfsy9TRCBlKwO2LNBFzpzvb9iIj+jR+eSc6DLYYvVOdivT/jm7MtU6TebYuRmzEOI7w40UA=='
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {count}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify lockfile install and production audit
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
        working-directory: auto—publish
      - name: Commit minimal lockfile diff and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto—publish/package-lock.json
          git rm .github/workflows/normalize-xmldom-lock.yml
          git commit -m "fix: pin patched xmldom transitive dependency"
          git push origin HEAD:master
