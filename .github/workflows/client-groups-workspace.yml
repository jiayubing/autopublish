name: Apply tested client grouping change

on:
  push:
    branches: [feat/client-groups]
    paths: [.github/workflows/client-groups-workspace.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Apply exact tested source tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          subprocess.run(["git", "diff", "--exit-code", "dbe3699701ae934f2a963291b7291186b13f2720", "HEAD", "--", ".", ":(exclude).github/workflows/client-groups-workspace.yml"], check=True)
          chunks = [
              "d3feb21ef152e3edf907210210cc48bead002063",
              "29fbf08521aa78707615fe91113f5d9e876b281b",
              "e2ae00ff08adc2964054a8662da52102e16da6ed",
              "1a4e4410a1219ff1c722cfac690d6a6d145a8ed3",
              "0908cce82c5f85eb50e800909488e6dd16bab85f",
              "3546a5683e7f177515f05394bd9ca78c0d706865",
              "62ac9d50b5457e0382388d86ea125bf9ac33ce1f",
              "f2a4a7225d871c24e3d63fe85c37eee8868e8b49",
          ]
          compressed = b""
          for sha in chunks:
              request = urllib.request.Request(
                  "https://api.github.com/repos/jiayubing/autopublish/git/blobs/" + sha,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              data = base64.b64decode(blob["content"])
              assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == sha
              compressed += data
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == "ecb99d38fd7221142c229a2f69f07465ead209e7606f5525cae93604b92dcc46"
          subprocess.run(["git", "apply", "--index", "--binary", "-"], input=patch, check=True)
          subprocess.run(["git", "rm", "--", ".github/workflows/client-groups-workspace.yml"], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          tree = subprocess.check_output(["git", "write-tree"], text=True).strip()
          assert tree == "5085088394143b541f6fa0640ee8337df6434b33", tree
          print("Verified tested final source tree:", tree)
          # The connector removes this temporary workflow after this push.
          # Keep its HEAD contents unchanged in the Actions-token commit.
          subprocess.run(["git", "restore", "--source=HEAD", "--staged", "--worktree", ".github/workflows/client-groups-workspace.yml"], check=True)
          PYCODE
          git config user.name "AutoPublish Assistant"
          git config user.email "autopublish-assistant@users.noreply.github.com"
          git commit -m "feat: add shared client groups and scoped customer selectors"
          git push origin HEAD:refs/heads/feat/client-groups
