name: Apply tested client grouping change

on:
  push:
    branches: [feat/client-groups]
    paths: [.github/workflows/client-groups-workspace.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact tested source tree and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, subprocess
          subprocess.run(["git", "diff", "--exit-code", "dbe3699701ae934f2a963291b7291186b13f2720", "HEAD", "--", ".", ":(exclude).github/workflows/client-groups-workspace.yml"], check=True)
          data = (
            ""
          )
          patch = gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == "ecb99d38fd7221142c229a2f69f07465ead209e7606f5525cae93604b92dcc46"
          subprocess.run(["git", "apply", "--index", "--binary", "-"], input=patch, check=True)
          subprocess.run(["git", "rm", "--", ".github/workflows/client-groups-workspace.yml"], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          tree = subprocess.check_output(["git", "write-tree"], text=True).strip()
          assert tree == "5085088394143b541f6fa0640ee8337df6434b33", tree
          print("Verified tested source tree:", tree)
          PYCODE
          git config user.name "AutoPublish Assistant"
          git config user.email "autopublish-assistant@users.noreply.github.com"
          git commit -m "feat: add shared client groups and scoped customer selectors"
          git push origin HEAD:refs/heads/feat/client-groups
