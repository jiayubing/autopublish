name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auto—publish/package-lock.json
      - run: npm ci
        working-directory: auto—publish
      - run: npm ci
        working-directory: auto—publish/media-workbench
      - run: npm test
        working-directory: auto—publish
      - run: npm run lint
        working-directory: auto—publish
      - run: npm run typecheck:renderer
        working-directory: auto—publish
      - run: npm run typecheck:bridge
        working-directory: auto—publish
      - run: npm run build:renderer
        working-directory: auto—publish
      - run: npm run test:links
        working-directory: auto—publish
      - run: npm run format:check
        working-directory: auto—publish
      - run: npm run test:packaging
        working-directory: auto—publish
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: auto—publish
      - name: Development dependency audit (non-blocking known-risk report)
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: auto—publish
      - run: npm run pack:smoke
        working-directory: auto—publish

  auth:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auto—publish/auth-server/package-lock.json
      - run: npm ci
        working-directory: auto—publish/auth-server
      - run: npm test
        working-directory: auto—publish/auth-server

  link-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auto—publish/package-lock.json
      - run: npm ci
        working-directory: auto—publish
      - run: npm run test:links
        working-directory: auto—publish
