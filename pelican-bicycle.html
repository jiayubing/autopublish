<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root { color-scheme: light; --ink: #254d52; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px; background: #f4f1e8; color: var(--ink); font-family: 'Microsoft YaHei', system-ui, sans-serif; }
    main { width: min(100%, 1120px); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 25px; }
    .eyebrow { font-size: 11px; letter-spacing: .25em; margin: 0 0 12px; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 43px); font-weight: 500; letter-spacing: .06em; }
    .subtitle { font-size: 13px; color: #718780; margin: 12px 0 0; }
    button { flex-shrink: 0; cursor: pointer; border: 1px solid #bac8bc; border-radius: 30px; background: transparent; color: var(--ink); padding: 11px 21px; font: inherit; font-size: 12px; }
    button:hover { background: #e4e9df; }
    button:focus-visible { outline: 3px solid #d98552; outline-offset: 4px; }
    .scene { border-radius: 18px; overflow: hidden; background: #daece7; box-shadow: 0 20px 55px #284d5010; }
    svg { width: 100%; height: auto; display: block; }
    footer { display: flex; justify-content: space-between; gap: 16px; font-size: 10px; letter-spacing: .15em; color: #7a8d85; padding-top: 19px; }
    .spin { animation: spin 1.3s linear infinite; }
    .ride { animation: bob .65s ease-in-out infinite alternate; }
    .scarf { animation: flutter .65s ease-in-out infinite alternate; transform-origin: 546px 267px; }
    .clouds { animation: drift 24s linear infinite; }
    .road { animation: road 1.3s linear infinite; }
    .paused * { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { from { transform: translateY(-2px) rotate(-.25deg); } to { transform: translateY(2px) rotate(.25deg); } }
    @keyframes flutter { to { transform: rotate(-7deg) scaleY(.85); } }
    @keyframes drift { to { transform: translateX(-280px); } }
    @keyframes road { to { transform: translateX(-220px); } }
    @media (max-width: 600px) { body { padding: 18px; } header { align-items: center; } .subtitle { font-size: 11px; } footer { font-size: 8px; letter-spacing: .06em; } }
    @media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">THE SLOW COAST CLUB · 001</p><h1>海风，慢慢骑。</h1><p class="subtitle">一只鹈鹕，一辆单车，一整个不赶时间的下午。</p></div>
      <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
    </header>
    <div class="scene" id="scene">
      <svg viewBox="0 0 1100 660" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
        <title id="title">鹈鹕的海岸骑行</title>
        <desc id="desc">白色鹈鹕戴着绿色小帽和橙色围巾，踩着青绿色自行车沿海岸前行。车轮与脚踏转动，围巾迎风飘扬，云朵和道路缓缓后退。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d8eae5"/><stop offset="1" stop-color="#f0f1d9"/></linearGradient>
          <g id="cloud" fill="#f8faf0"><path d="M0 28 Q-2 11 18 12 Q23-9 45 1 Q62-5 70 14 Q94 10 98 28Z"/></g>
          <g id="wheel">
            <circle r="83" fill="#f5f0d6" fill-opacity=".38" stroke="#254d52" stroke-width="12"/>
            <circle r="73" fill="none" stroke="#f8f4e7" stroke-width="3"/>
            <g class="spin" stroke="#6b8b87" stroke-width="2">
              <path d="M-72 0H72M0-72V72M-51-51L51 51M-51 51L51-51M-27-67L27 67M-67-27L67 27M-67 27L67-27M-27 67L27-67"/>
              <path d="M-10-72H10" stroke="#e5ad57" stroke-width="5"/>
            </g>
            <circle r="8" fill="#254d52"/>
          </g>
        </defs>
        <path fill="url(#sky)" d="M0 0H1100V660H0Z"/>
        <circle cx="857" cy="125" r="57" fill="#f5cf7c"/>
        <circle cx="857" cy="125" r="75" fill="none" stroke="#f5dc9a" opacity=".4"/>
        <g class="clouds" opacity=".85"><use href="#cloud" x="115" y="112"/><use href="#cloud" x="405" y="70"/><use href="#cloud" x="980" y="175"/><use href="#cloud" x="1240" y="100"/></g>
        <path d="M0 312Q130 245 272 309T538 306T817 300T1100 288V411H0Z" fill="#aaccc0"/>
        <path d="M0 349Q181 311 376 347T747 340T1100 336V460H0Z" fill="#77b4ae"/>
        <g fill="none" stroke="#d4e8da" stroke-width="3" stroke-linecap="round" opacity=".6"><path d="M66 374h87m-40 22h54m608-23h95m-50 22h106M310 369h45M951 365h76"/></g>
        <path d="M0 429Q261 405 531 432T1100 416V660H0Z" fill="#e9dcb5"/>
        <path d="M0 506Q339 487 1100 502V621H0Z" fill="#f6edd4"/>
        <path d="M0 621H1100V660H0Z" fill="#d8d3a7"/>
        <g class="road" stroke="#d8ccaa" stroke-width="4" stroke-linecap="round"><path d="M0 567h66m154 0h66m154 0h66m154 0h66m154 0h66m154 0h66M90 607h20m200 0h20m200 0h20m200 0h20m200 0h20m200 0h20"/></g>
        <g stroke="#809f80" stroke-width="3" fill="none" stroke-linecap="round"><path d="M81 489l-9-24m9 24 10-32m-10 32 20-16M988 481l-12-24m12 24 8-35m-8 35 24-16"/></g>
        <ellipse cx="554" cy="543" rx="243" ry="15" fill="#536c58" opacity=".13"/>
        <g class="ride">
          <use href="#wheel" transform="translate(383 450)"/>
          <use href="#wheel" transform="translate(726 450)"/>
          <!-- The far leg follows the opposite pedal. -->
          <path d="M493 325L486 379" fill="none" stroke="#d39446" stroke-width="14" stroke-linecap="round"/>
          <path fill="none" stroke="#d39446" stroke-width="12" stroke-linecap="round"><animate attributeName="d" dur="1.3s" repeatCount="indefinite" values="M486 379L507 405L550 450;M486 379L516 416L520 480;M486 379L481 415L490 450;M486 379L486 387L520 420;M486 379L507 405L550 450"/> </path>
          <g fill="none" stroke="#328c86" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"><path d="M383 450L468 337L520 450ZM468 337H674L520 450M726 450L665 302"/></g>
          <path d="M468 337L457 314M665 302L657 282H688" fill="none" stroke="#254d52" stroke-width="8" stroke-linecap="round"/>
          <path d="M432 312H478" stroke="#254d52" stroke-width="13" stroke-linecap="round"/>
          <path d="M688 282h15" stroke="#d89054" stroke-width="10" stroke-linecap="round"/>
          <path d="M686 289Q704 325 688 348" fill="none" stroke="#254d52" stroke-width="2"/>
          <circle cx="520" cy="450" r="23" fill="#eff0d7" stroke="#254d52" stroke-width="5"/>
          <g transform="translate(520 450)"><g class="spin" stroke="#254d52" stroke-width="6"><path d="M-30 0H30"/><path d="M-30-9v18M30-9v18" stroke-width="8"/></g></g>
          <!-- Tail, body, long neck, and generous pelican bill. -->
          <path d="M426 283L367 259L391 299L376 298L419 319Z" fill="#fff9e8" stroke="#345959" stroke-width="3" stroke-linejoin="round"/>
          <path d="M418 273C448 249 490 255 518 275C534 268 528 235 529 202C531 166 555 148 579 161C603 174 588 202 578 222C565 248 586 292 558 318C530 349 463 344 429 325C404 312 402 292 418 273Z" fill="#fffbed" stroke="#345959" stroke-width="3"/>
          <path d="M427 294Q473 277 516 306Q480 340 442 316" fill="#e0e8d9" stroke="#829c90" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M501 292Q560 327 655 279" fill="none" stroke="#345959" stroke-width="17" stroke-linecap="round"/>
          <path d="M501 292Q560 327 655 279" fill="none" stroke="#eff2df" stroke-width="12" stroke-linecap="round"/>
          <path d="M581 190L701 207Q675 243 620 233Q588 229 578 210Z" fill="#edb85e" stroke="#345959" stroke-width="3" stroke-linejoin="round"/>
          <path d="M583 188Q634 184 712 207L580 204" fill="#f7ce77" stroke="#345959" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="570" cy="185" r="5" fill="#254d52"/><circle cx="571.5" cy="183.5" r="1.4" fill="white"/>
          <path d="M548 169Q565 160 579 172" fill="none" stroke="#345959" stroke-width="2" stroke-linecap="round"/>
          <path d="M535 161L541 140Q561 129 580 142L585 160Z" fill="#3f8174" stroke="#345959" stroke-width="3"/>
          <path d="M531 161Q565 151 599 163" fill="none" stroke="#345959" stroke-width="7" stroke-linecap="round"/>
          <path class="scarf" d="M545 256Q502 254 477 227L484 248L466 255Q502 277 548 269Z" fill="#dc7850" stroke="#ad5f43" stroke-width="2"/>
          <path d="M529 251Q544 261 569 252L572 266Q549 277 529 265Z" fill="#e98b59" stroke="#ad5f43" stroke-width="2"/>
          <path d="M482 330L474 377" fill="none" stroke="#edb358" stroke-width="14" stroke-linecap="round"/>
          <path fill="none" stroke="#edb358" stroke-width="12" stroke-linecap="round"><animate attributeName="d" dur="1.3s" repeatCount="indefinite" values="M474 377L456 418L490 450;M474 377L469 391L520 420;M474 377L511 404L550 450;M474 377L483 431L520 480;M474 377L456 418L490 450"/></path>
          <path fill="#efb65d" stroke="#bd8740" stroke-width="2" stroke-linejoin="round"><animate attributeName="d" dur="1.3s" repeatCount="indefinite" values="M482 446l-6 12h37l-23-12Z;M512 416l-6 12h37l-23-12Z;M542 446l-6 12h37l-23-12Z;M512 476l-6 12h37l-23-12Z;M482 446l-6 12h37l-23-12Z"/></path>
        </g>
        <g fill="#456d64" font-family="Georgia, serif"><text x="52" y="62" font-size="16" font-style="italic">A little less hurry.</text><text x="1046" y="614" font-size="12" text-anchor="end" letter-spacing="3">COASTAL RIDE</text></g>
      </svg>
    </div>
    <footer><span>沿着海岸线，把时间交给风。</span><span>SVG ANIMATION · 无限好天气</span></footer>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const svg = scene.querySelector('svg');
    const toggle = document.getElementById('toggle');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = reducedMotion.matches;
    function setPaused(value) {
      paused = value;
      scene.classList.toggle('paused', paused);
      if (paused) svg.pauseAnimations(); else svg.unpauseAnimations();
      toggle.textContent = paused ? '播放动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.disabled = reducedMotion.matches;
      if (reducedMotion.matches) toggle.textContent = '已减少动态';
    }
    toggle.addEventListener('click', () => setPaused(!paused));
    reducedMotion.addEventListener('change', event => setPaused(event.matches));
    setPaused(paused);
  </script>
</body>
</html>
